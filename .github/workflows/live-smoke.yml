# Reusable fixture live smoke against a deployed LambdaDB environment.
# Callers: CI main pushes (dev), release verification and tag releases (prod).
name: Live smoke

on:
  workflow_call:
    inputs:
      environment:
        description: LambdaDB environment to test, dev or prod.
        required: true
        type: string
      ref:
        description: Commit to test. Defaults to the caller's commit.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # A job's environment must be known before it starts, so the selection runs
  # in its own job.
  target:
    name: Select the LambdaDB environment
    runs-on: ubuntu-latest
    outputs:
      prefix: ${{ steps.target.outputs.prefix }}
      environment: ${{ steps.target.outputs.environment }}
    steps:
      # Each environment reads only its own Variables. A missing Variable fails
      # the run; it never falls back to the other environment.
      - name: Select the LambdaDB environment
        id: target
        env:
          SMOKE_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          case "$SMOKE_ENVIRONMENT" in
            dev) PREFIX=LAMBDADB_DEV_ ;;
            prod) PREFIX=LAMBDADB_PROD_ ;;
            *) echo "Unknown live smoke environment: $SMOKE_ENVIRONMENT" >&2; exit 1 ;;
          esac
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"
          echo "environment=$SMOKE_ENVIRONMENT" >> "$GITHUB_OUTPUT"

  # The GitHub Environment holds the smoke project API key. Its deployment
  # policy admits only main (dev, prod) and v* tags (prod).
  smoke:
    name: Fixture live smoke (${{ inputs.environment }})
    needs: target
    runs-on: ubuntu-latest
    environment: ${{ needs.target.outputs.environment }}
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run deployed fixture live smoke
        env:
          LAMBDADB_BASE_URL: ${{ vars[format('{0}BASE_URL', needs.target.outputs.prefix)] }}
          LAMBDADB_PROJECT_NAME: ${{ vars[format('{0}PROJECT_NAME', needs.target.outputs.prefix)] }}
          LAMBDADB_PROJECT_API_KEY: ${{ secrets.LAMBDADB_PROJECT_API_KEY }}
        run: |
          echo "Live smoke target: $LAMBDADB_BASE_URL project $LAMBDADB_PROJECT_NAME at $(git rev-parse HEAD)"
          go run ./tools/livesmoke
