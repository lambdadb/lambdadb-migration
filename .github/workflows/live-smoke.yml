# Reusable fixture live smoke against a deployed LambdaDB environment.
# Callers: CI main pushes (dev), release verification and tag releases (prod).
name: Live smoke

on:
  workflow_call:
    inputs:
      environment:
        description: LambdaDB environment to test, dev or prod.
        required: true
        type: string
      ref:
        description: Commit to test. Defaults to the caller's commit.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    name: Fixture live smoke (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # Each environment reads only its own Variables. A missing Variable fails
      # the run; it never falls back to the other environment.
      - name: Select the LambdaDB environment
        id: target
        env:
          SMOKE_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          case "$SMOKE_ENVIRONMENT" in
            dev) PREFIX=LAMBDADB_DEV_ ;;
            prod) PREFIX=LAMBDADB_PROD_ ;;
            *) echo "Unknown live smoke environment: $SMOKE_ENVIRONMENT" >&2; exit 1 ;;
          esac
          echo "prefix=$PREFIX" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Authenticate smoke tests to AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars[format('{0}SMOKE_AWS_ROLE_ARN', steps.target.outputs.prefix)] }}
          aws-region: ap-northeast-2
          role-session-name: migration-smoke-${{ github.run_id }}

      - name: Run deployed fixture live smoke
        env:
          LAMBDADB_BASE_URL: ${{ vars[format('{0}BASE_URL', steps.target.outputs.prefix)] }}
          LAMBDADB_PROJECT_NAME: ${{ vars[format('{0}PROJECT_NAME', steps.target.outputs.prefix)] }}
          LAMBDADB_SMOKE_SECRET_ARN: ${{ vars[format('{0}SMOKE_SECRET_ARN', steps.target.outputs.prefix)] }}
        run: |
          echo "Live smoke target: $LAMBDADB_BASE_URL project $LAMBDADB_PROJECT_NAME at $(git rev-parse HEAD)"
          go run ./tools/livesmoke
