name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Go test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build image
        run: |
          docker build \
            --build-arg VERSION=ci \
            --build-arg COMMIT="${GITHUB_SHA}" \
            -t lambdadb-migration:ci .

      - name: Smoke test image
        run: docker run --rm lambdadb-migration:ci --help

  goreleaser:
    name: GoReleaser snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run snapshot release
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --snapshot --clean

  # Main pushes run the fixture live suite against the dev environment.
  # Pull requests have no credentials and run no live tests.
  live-smoke:
    name: Dev live smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    # The Environment holds this repository's dev smoke key; its deployment
    # policy admits only main.
    environment: dev
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run deployed fixture live smoke
        uses: ./.github/actions/live-smoke
        with:
          base-url: ${{ vars.LAMBDADB_DEV_BASE_URL }}
          project-name: ${{ vars.LAMBDADB_DEV_PROJECT_NAME }}
          project-api-key: ${{ secrets.LAMBDADB_PROJECT_API_KEY }}
