name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Tags must point at a commit on main.
  check-tag:
    name: Verify tag commit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify the tag commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Tag $GITHUB_REF_NAME points at $(git rev-parse HEAD), which is not on main" >&2
            exit 1
          fi

  # GoReleaser publishes only after the production live smoke passes.
  live-smoke:
    name: Production live smoke
    needs: check-tag
    runs-on: ubuntu-latest
    # The Environment holds this repository's prod smoke key; its deployment
    # policy admits only main and v* tags.
    environment: prod
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run deployed fixture live smoke
        uses: ./.github/actions/live-smoke
        with:
          base-url: ${{ vars.LAMBDADB_PROD_BASE_URL }}
          project-name: ${{ vars.LAMBDADB_PROD_PROJECT_NAME }}
          project-api-key: ${{ secrets.LAMBDADB_PROJECT_API_KEY }}

  goreleaser:
    name: Publish release
    needs: live-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
