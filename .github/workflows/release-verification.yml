# Verify a main commit against production before tagging it for release.
name: Release verification

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit on main to verify. Defaults to the head of main.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve main commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The prod GitHub Environment admits only main and v* tags.
      - name: Verify the commit is on main
        id: commit
        env:
          REQUESTED_COMMIT: ${{ inputs.commit }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Run release verification from main, not $GITHUB_REF" >&2
            exit 1
          fi
          git fetch origin main
          SHA=$(git rev-parse --verify --end-of-options "${REQUESTED_COMMIT:-origin/main}^{commit}")
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "Commit $SHA is not on main" >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Verifying main commit \`$SHA\` against production. Tag this commit after the run passes." >> "$GITHUB_STEP_SUMMARY"

  live-smoke:
    name: Production live smoke
    needs: resolve
    runs-on: ubuntu-latest
    # The Environment holds this repository's prod smoke key; its deployment
    # policy admits only main and v* tags.
    environment: prod
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Run deployed fixture live smoke
        uses: ./.github/actions/live-smoke
        with:
          base-url: ${{ vars.LAMBDADB_PROD_BASE_URL }}
          project-name: ${{ vars.LAMBDADB_PROD_PROJECT_NAME }}
          project-api-key: ${{ secrets.LAMBDADB_PROJECT_API_KEY }}
